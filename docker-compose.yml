services:
  finora-backend:
    build:
      context: ./finora-backend
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    env_file:
      - ./finora-backend/.env
    volumes:
      # HF model cache persisted across rebuilds (avoids re-downloading ~500MB)
      - hf_cache:/app/data/hf_cache
    environment:
      - BACKEND_PORT=7860
      - ENV=development
      - CORS_ORIGINS=http://localhost:3000,http://finora-frontend:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  finora-frontend:
    build:
      context: ./finora-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:7860
        - NEXT_PUBLIC_APP_NAME=Finora
    ports:
      - "3000:3000"
    env_file:
      - ./finora-frontend/.env
    environment:
      - BACKEND_URL=http://finora-backend:7860
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:7860
    depends_on:
      finora-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf_cache:
